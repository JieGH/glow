[package]
name = "glow"
version = "0.2.0"
edition = "2021"
description = "A macOS menu-bar brightness controller"
license = "MIT"
repository = "https://github.com/JieGH/glow"

[package.metadata.macos]
bundle-name = "Glow"
bundle-identifier = "io.github.jiegh.glow"
minimum-system-version = "13.0"

[dependencies]
eframe = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["block2"] }
block2 = "0.6"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
